<!doctype html>
<!-- tools/phone_camera_page.html — Phase 2.2 phone camera page.
  Served over the SAME HTTPS origin as the mic page by
  tools/phone_mic_gateway.py (/camera -> WSS /cam, same TLS cert, same LAN).
  Vanilla JS, zero external dependencies (offline-first, like the mic page).

  Capture: getUserMedia VIDEO ONLY (facingMode=user front camera for the
  face-stream use case) -> <video> preview -> canvas 320x240 ->
  canvas.toBlob JPEG q0.6 -> WSS binary frames at ~10 fps. Realtime display
  only: no recording, no upload anywhere except the PC gateway on this LAN.

  Resilience mirrors the mic page (never wedge START, cam-ready 6 s timeout,
  heartbeat ping/pong 15 s, auto-reconnect with a FRESH session, online /
  offline + visibilitychange hooks). Permission states are explicit:
  UNKNOWN / REQUESTING / READY / DENIED / NO_CAMERA / ERROR — the PC/game
  sees them as cam ERROR frames or silence, never a crash. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LWE Phone Camera (dev)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #101418; color: #eee; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 12px; margin: 2px; font-size: 14px; background: #333; }
  .ok { background: #1c6b3a; } .bad { background: #8a2424; } .warn { background: #8a6d1c; }
  button { font-size: 18px; padding: 10px 22px; margin: 6px 4px 6px 0; }
  button:disabled { opacity: 0.45; }
  .row { margin: 6px 0; } code { font-size: 12px; word-break: break-all; }
  #preview { width: 100%; max-width: 360px; border-radius: 8px; background: #000; }
  #steps { font-size: 13px; margin: 8px 0; }
  #steps span { padding: 3px 8px; border-radius: 10px; background: #333; margin-right: 4px; white-space: nowrap; }
  #steps span.done { background: #1c6b3a; }
  #steps span.now { background: #8a6d1c; }
  #log { background: #0a0d10; border: 1px solid #333; border-radius: 6px; padding: 6px 8px;
         font-size: 12px; font-family: monospace; max-height: 160px; overflow-y: auto; margin-top: 6px; }
  #log div { margin: 1px 0; }
  #screenoff { width: 100%; background: #5a3a10; color: #ffe9c4; }
  #blackout { position: fixed; inset: 0; background: #000; z-index: 9999;
              display: flex; align-items: center; justify-content: center;
              text-align: center; color: #555; font-size: 15px; }
  #blackout[hidden] { display: none; }
</style>
</head>
<body>
<h2>PHONE CAMERA <small>(dev transport test)</small></h2>
<div class="row"><button id="screenoff" onclick="setScreenOff(true)">TẮT MÀN HÌNH (tiết kiệm pin)</button></div>
<div id="blackout" hidden onclick="setScreenOff(false)">
  <div>ĐANG STREAM — camera vẫn chạy<br>Chạm vào màn hình để mở lại</div>
</div>
<div class="row">PC: <span id="pc" class="pill">CONNECTING</span>
Camera: <span id="cam" class="pill">UNKNOWN</span>
State: <span id="state" class="pill">IDLE</span></div>
<div id="steps"><span id="st1">1-connect</span><span id="st2">2-camera</span><span id="st3">3-start</span><span id="st4">4-stream</span><span id="st5">5-stop</span></div>
<div class="row"><video id="preview" muted playsinline autoplay></video></div>
<div class="row">
<button id="start">START CAMERA</button>
<button id="stop" disabled>STOP</button>
</div>
<div class="row">Duration: <span id="dur">0.00</span> sec &nbsp; Frames: <span id="frames">0</span></div>
<div class="row">Status: <span id="status">idle</span></div>
<div class="row"><code id="srv"></code></div>
<div class="row">Steps log (where did it get to?):<div id="log"></div></div>
<script>
(function () {
  "use strict";
// Screen-off (battery/heat saver): pure-black overlay + preview shrunk to 2px
// (kept PLAYING so frames stay live) + capture capped to 30fps. Stream and
// socket untouched. Do NOT press the power button (OS may suspend the tab) —
window.__screenOff = false;
window.effMaxFps = function () { return window.__screenOff ? 30 : 60; };
window.setScreenOff = function (on) {
  window.__screenOff = !!on;
  var b = document.getElementById("blackout");
  if (b) b.hidden = !window.__screenOff;
  var pv = document.getElementById("preview");
  if (pv) {
    pv.style.opacity = window.__screenOff ? "0" : "1";
    pv.style.maxWidth = window.__screenOff ? "2px" : "";
  }
  var btn = document.getElementById("screenoff");
  if (btn) btn.textContent = window.__screenOff ? "MỞ MÀN HÌNH" : "TẮT MÀN HÌNH (tiết kiệm pin)";
};
})();
  var LS_GOOD = "lwe_last_good_cam_ws";
  var READY_TIMEOUT_MS = 6000, CONNECT_TIMEOUT_MS = 7000;
  var PING_EVERY_MS = 15000, PONG_TIMEOUT_MS = 6000, RECONNECT_BASE_MS = 1500;
  // 60fps cap (average of most screens, 30fps in screen-off battery mode).
  var TARGET_W = 320, TARGET_H = 240, TARGET_FPS = 60, JPEG_Q = 0.6;

  var pc = document.getElementById("pc"), cam = document.getElementById("cam"),
      state = document.getElementById("state"), status = document.getElementById("status"),
      preview = document.getElementById("preview"),
      dur = document.getElementById("dur"), framesEl = document.getElementById("frames"),
      startBtn = document.getElementById("start"), stopBtn = document.getElementById("stop"),
      srvEl = document.getElementById("srv");

  function pill(el, txt, cls) { el.textContent = txt; el.className = "pill " + (cls || ""); }
  function say(t) { status.textContent = t; }
  var stepIds = ["st1", "st2", "st3", "st4", "st5"], curStep = 0;
  function logStep(n, t) {
    var now = new Date(), ts = ("0" + now.getHours()).slice(-2) + ":" +
      ("0" + now.getMinutes()).slice(-2) + ":" + ("0" + now.getSeconds()).slice(-2);
    var box = document.getElementById("log"), line = document.createElement("div");
    line.textContent = "[" + ts + "] STEP " + n + "/5 " + t;
    box.appendChild(line); box.scrollTop = box.scrollHeight;
  }
  function setStep(n) {
    curStep = n;
    for (var i = 0; i < stepIds.length; i++) {
      var el = document.getElementById(stepIds[i]);
      el.className = (i + 1 < n) ? "done" : ((i + 1 === n) ? "now" : "");
    }
  }
  setStep(1); logStep(1, "connecting to PC...");

  function originWs() {
    return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/cam";
  }
  var endpoints = [originWs()];
  try {
    var g = localStorage.getItem(LS_GOOD);
    if (g && endpoints.indexOf(g) < 0) endpoints.push(g);
  } catch (e) {}
  var activeEndpoint = endpoints[0];
  srvEl.textContent = activeEndpoint;

  var ws = null, stream = null, session = null;
  var frameCount = 0, startedAt = 0, captureTimer = null, rafId = 0;
  var streaming = false, serverReady = false, stopped = true, starting = false;
  var wantStreaming = false;
  var reconnectTimer = null, readyTimer = null, pingTimer = null, pongTimer = null;
  var lastPongAt = 0, connectAttempt = 0, manualStop = false, sendBusy = false;
  var canvas = document.createElement("canvas");
  canvas.width = TARGET_W; canvas.height = TARGET_H;
  var ctx2d = canvas.getContext("2d");

  function setState(s, cls) { pill(state, s, cls); }
  function setStartEnabled(on) { startBtn.disabled = !on; }
  function setStopEnabled(on) { stopBtn.disabled = !on; }
  function clearTimers() {
    if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
    if (pongTimer) { clearTimeout(pongTimer); pongTimer = null; }
  }
  function stopCaptureLoop() {
    if (captureTimer) { clearInterval(captureTimer); captureTimer = null; }
    if (rafId) { try { cancelAnimationFrame(rafId); } catch (e) {} rafId = 0; }
  }
  function cleanupCamera() {
    streaming = false; serverReady = false;
    stopCaptureLoop();
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    stream = null;
    try { preview.srcObject = null; } catch (e) {}
  }
  function stopHeartbeat() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }
  function startHeartbeat() {
    stopHeartbeat(); lastPongAt = Date.now();
    pingTimer = setInterval(function () {
      if (!ws || ws.readyState !== 1) return;
      try { ws.send(JSON.stringify({ type: "ping", t: Date.now() })); } catch (e) { return; }
      if (pongTimer) clearTimeout(pongTimer);
      pongTimer = setTimeout(function () {
        if (Date.now() - lastPongAt > PONG_TIMEOUT_MS + PING_EVERY_MS) {
          logStep(curStep, "heartbeat lost (no pong) — reconnecting");
          try { ws.close(); } catch (e) {}
        }
      }, PONG_TIMEOUT_MS);
    }, PING_EVERY_MS);
  }

  function connect() {
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    pill(pc, "CONNECTING", "warn"); setState("CONNECTING", "warn");
    setStep(1);
    var i = 0;
    function tryNext() {
      if (i >= endpoints.length) {
        pill(pc, "DISCONNECTED", "bad"); setState("DISCONNECTED", "bad");
        say("no route to PC — check Wi-Fi / QR, retrying…");
        logStep(1, "all endpoint(s) failed — retry in 3 s");
        reconnectTimer = setTimeout(function () { connectAttempt++; connect(); }, 3000);
        if (!wantStreaming) setStartEnabled(true);
        return;
      }
      var url = endpoints[i++];
      say("connecting " + url + " …");
      var sock;
      try { sock = new WebSocket(url); } catch (e) { tryNext(); return; }
      sock.binaryType = "arraybuffer";
      var done = false;
      var to = setTimeout(function () {
        if (done) return; done = true;
        try { sock.close(); } catch (e) {}
        logStep(1, "timeout: " + url);
        tryNext();
      }, CONNECT_TIMEOUT_MS);
      sock.onopen = function () {
        if (done) { try { sock.close(); } catch (e) {} return; }
        done = true; clearTimeout(to);
        ws = sock; activeEndpoint = url;
        try { localStorage.setItem(LS_GOOD, url); } catch (e) {}
        wireSocket();
        pill(pc, "CONNECTED", "ok"); setState(wantStreaming ? "RECONNECTING" : "CONNECTED", "ok");
        say("connected"); logStep(1, "PC connected via " + url + " — press START CAMERA and allow the camera"); setStep(2);
        srvEl.textContent = url;
        startHeartbeat();
        if (wantStreaming && !manualStop) {
          logStep(2, "network changed — auto-resuming stream with a FRESH session…");
          setTimeout(function () { startStreaming(true); }, 400);
        }
      };
      sock.onerror = function () {
        if (done) return;
        logStep(1, "socket error: " + url + " (see PC CAM log)");
      };
      sock.onclose = function () {
        if (done) return; done = true; clearTimeout(to);
        tryNext();
      };
    }
    tryNext();
  }

  function scheduleReconnect(ms) {
    if (reconnectTimer) clearTimeout(reconnectTimer);
    var delay = ms || Math.min(10000, RECONNECT_BASE_MS * Math.pow(1.5, Math.min(connectAttempt, 6)));
    reconnectTimer = setTimeout(function () { connectAttempt++; connect(); }, delay);
  }

  function wireSocket() {
    ws.onclose = function () {
      stopHeartbeat(); clearTimers();
      var wasWant = wantStreaming;
      streaming = false; serverReady = false; starting = false;
      pill(pc, "DISCONNECTED", "bad"); setState("DISCONNECTED", "bad");
      say("connection lost. reconnecting…");
      logStep(curStep, "link lost — auto-reconnecting (fresh session next time)");
      if (!wasWant || manualStop) {
        cleanupCamera(); setStartEnabled(true); setStopEnabled(false); setStep(1);
      } else {
        say("mất kết nối — đang tự kết nối lại…");
      }
      ws = null;
      scheduleReconnect();
    };
    ws.onerror = function () { pill(pc, "ERROR", "bad"); say("socket error"); logStep(curStep, "socket error (see PC CAM log)"); };
    ws.onmessage = function (ev) {
      var msg = "";
      try { msg = JSON.parse(ev.data); } catch (e) { say("protocol error (bad json)"); return; }
      if (msg.type === "cam-ready") {
        serverReady = true;
        if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
        say("server ready, session " + msg.sessionSerial);
        logStep(4, "PC accepted session " + msg.sessionSerial + " — streaming frames");
      }
      else if (msg.type === "pong") { lastPongAt = Date.now(); }
      else if (msg.type === "ping") { try { ws.send(JSON.stringify({ type: "pong", t: msg.t })); } catch (e) {} }
      else if (msg.type === "error") {
        pill(pc, "ERROR", "bad"); say("server: " + msg.reason); logStep(curStep, "PC rejected: " + msg.reason);
        wantStreaming = false; streaming = false; serverReady = false; starting = false;
        if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
        cleanupCamera(); setStartEnabled(true); setStopEnabled(false);
      }
      else if (msg.type === "cam-stopped") { say("stopped ok"); logStep(5, "PC confirmed stop"); }
    };
  }

  function grabAndSend() {
    if (!streaming || !ws || ws.readyState !== 1) return;
    if (!serverReady || sendBusy) return; // drop, never queue (latest-frame transport)
    if (!preview.videoWidth) return;
    sendBusy = true;
    try {
      // Cover-crop the video into the 4:3 canvas (no stretch on the PC side).
      var vw = preview.videoWidth, vh = preview.videoHeight;
      var targetAR = TARGET_W / TARGET_H, srcAR = vw / vh;
      var sw, sh, sx, sy;
      if (srcAR > targetAR) { sh = vh; sw = vh * targetAR; sx = (vw - sw) / 2; sy = 0; }
      else { sw = vw; sh = vw / targetAR; sx = 0; sy = (vh - sh) / 2; }
      ctx2d.drawImage(preview, sx, sy, sw, sh, 0, 0, TARGET_W, TARGET_H);
    } catch (e) { sendBusy = false; return; }
    function done(blob) {
      if (!blob) { sendBusy = false; return; }
      var fr = new FileReader();
      fr.onload = function () {
        try {
          if (streaming && ws && ws.readyState === 1 && serverReady) {
            ws.send(fr.result);
            if (frameCount === 0) logStep(4, "first frame sent — stream is LIVE");
            frameCount++;
            framesEl.textContent = frameCount;
            dur.textContent = ((performance.now() - startedAt) / 1000).toFixed(2);
            if (frameCount === 1) setStopEnabled(true);
          }
        } catch (e) {}
        sendBusy = false;
      };
      fr.onerror = function () { sendBusy = false; };
      try { fr.readAsArrayBuffer(blob); } catch (e) { sendBusy = false; }
    }
    try {
      if (canvas.toBlob) canvas.toBlob(done, "image/jpeg", JPEG_Q);
      else sendBusy = false;
    } catch (e) { sendBusy = false; }
  }

  function startStreaming(isAuto) {
    if (streaming || starting) return;
    starting = true;
    if (!ws || ws.readyState !== 1) {
      say("not connected yet — waiting for PC…");
      logStep(curStep, "START pressed while offline — will auto-start when linked");
      wantStreaming = true; manualStop = false;
      setStartEnabled(false);
      starting = false;
      if (!ws) connect();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      pill(cam, "UNSUPPORTED", "bad"); say("browser needs HTTPS + camera support");
      setStartEnabled(true);
      starting = false;
      return;
    }
    var camAlive = stream && stream.getTracks().some(function (t) { return t.readyState === "live"; });
    pill(cam, camAlive ? "READY" : "REQUESTING", camAlive ? "ok" : "warn");
    setStartEnabled(false);
    function begin(s) {
      stream = s;
      try { preview.srcObject = stream; preview.play(); } catch (e) {}
      pill(cam, "READY", "ok"); logStep(2, (isAuto ? "auto-resume: " : "") + "camera ready — starting stream"); setStep(3);
      session = "cam-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36);
      try {
        ws.send(JSON.stringify({ type: "cam-start", session: session,
          width: TARGET_W, height: TARGET_H, format: "jpeg", fps: TARGET_FPS }));
      } catch (e) {
        say("send failed — reconnecting…"); logStep(3, "START send failed, will retry after reconnect");
        wantStreaming = true; manualStop = false; cleanupCamera(); setStartEnabled(true);
        starting = false;
        try { ws.close(); } catch (ex) {}
        return;
      }
      frameCount = 0; startedAt = performance.now();
      streaming = true; serverReady = false; stopped = false; starting = false;
      wantStreaming = true; manualStop = false;
      setState("STREAMING", "ok"); setStartEnabled(false); setStopEnabled(false);
      setStep(4); logStep(3, "session " + session + " START sent — waiting for PC ready (6 s timeout)…");
      framesEl.textContent = "0";
      if (readyTimer) clearTimeout(readyTimer);
      readyTimer = setTimeout(function () {
        if (streaming && !serverReady) {
          say("PC không phản hồi — bấm START CAMERA để thử lại");
          logStep(4, "READY timeout after 6 s — START re-enabled.");
          wantStreaming = false; streaming = false; starting = false;
          cleanupCamera(); setStartEnabled(true); setStopEnabled(false);
        }
      }, READY_TIMEOUT_MS);
      stopCaptureLoop();
      // Capped capture: rAF-driven, at most window.effMaxFps() grabs/s
      // (60 normal, 30 screen-off); sendBusy drops the overflow.
      var lastGrab = 0;
      function loop() {
        if (!streaming) return;
        var now = performance.now();
        if (now - lastGrab >= 1000 / window.effMaxFps()) { lastGrab = now; grabAndSend(); }
        rafId = requestAnimationFrame(loop);
      }
      loop();
      say(isAuto ? "auto-resumed streaming…" : "streaming…");
    }
    if (camAlive) { try { begin(stream); } catch (e) { starting = false; setStartEnabled(true); } }
    else {
      // Prefer the FRONT camera (face-stream use case). If the device has no
      // front camera the constraint degrades gracefully to any camera.
      var constraints = { audio: false,
        video: { facingMode: { ideal: "user" }, width: { ideal: TARGET_W }, height: { ideal: TARGET_H } } };
      navigator.mediaDevices.getUserMedia(constraints).then(begin).catch(function (err) {
        var name = err && err.name ? err.name : "error";
        wantStreaming = false; starting = false;
        setStartEnabled(true); // never wedge
        if (name === "NotAllowedError" || name === "SecurityError") { pill(cam, "DENIED", "bad"); say("camera permission denied — allow it and retry"); logStep(2, "camera DENIED — allow it in the browser and press START again"); }
        else if (name === "NotFoundError" || name === "OverconstrainedError") { pill(cam, "NO_CAMERA", "bad"); say("no camera found"); logStep(2, "no camera found on this phone"); }
        else { pill(cam, "ERROR", "bad"); say("camera error: " + name); logStep(2, "camera error: " + name); }
      });
    }
  }

  startBtn.onclick = function () { manualStop = false; startStreaming(false); };
  stopBtn.onclick = function () {
    manualStop = true; wantStreaming = false; starting = false;
    if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
    if (streaming && ws && ws.readyState === 1 && !stopped) {
      stopped = true;
      try { ws.send(JSON.stringify({ type: "cam-stop", session: session })); } catch (e) {}
    }
    streaming = false; serverReady = false;
    setState("STOPPED", ""); setStartEnabled(true); setStopEnabled(false);
    setStep(5); logStep(4, "STOP sent (" + frameCount + " frames) — session closing");
    cleanupCamera(); say("stopped");
  };
  window.addEventListener("pagehide", function () {
    try { if (ws && ws.readyState === 1 && streaming) ws.send(JSON.stringify({ type: "cancel", session: session })); } catch (e) {}
  });
  window.addEventListener("offline", function () { logStep(curStep, "OS reports OFFLINE — will resume when back"); say("offline — waiting for network…"); });
  window.addEventListener("online", function () {
    logStep(curStep, "OS reports ONLINE — reconnecting now");
    connectAttempt = 0;
    if (reconnectTimer) clearTimeout(reconnectTimer);
    if (!ws || ws.readyState > 1) connect();
    else if (wantStreaming && !streaming) startStreaming(true);
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      if (wantStreaming && (!ws || ws.readyState > 1)) { connectAttempt = 0; connect(); }
    }
  });
  connect();
})();
</script>
</body>
</html>
