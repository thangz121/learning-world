<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>1.9.9 Blind Review (mobile)</title>
<style>
  :root { --pad: 12px; --tap: 44px; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0 auto;
    max-width: 720px;
    padding: var(--pad);
    padding-bottom: 96px;
    line-height: 1.45;
    background: #f7f7f8;
    color: #111;
  }
  .banner {
    background: #fff3cd;
    border: 1px solid #e6d089;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .banner h1 { font-size: 1.15rem; margin: 0 0 8px; }
  .banner p { margin: 6px 0; font-size: 0.95rem; }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 14px;
    margin: 0 0 16px;
    overflow: visible;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 8px; word-break: break-all; }
  .target {
    display: inline-block;
    background: #111;
    color: #fff;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    letter-spacing: 0.04em;
    margin: 4px 0 10px;
  }
  .meta { font-size: 0.85rem; color: #444; margin-bottom: 10px; }
  .audio-block { margin: 10px 0; }
  .audio-block .lbl {
    font-size: 0.8rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 4px;
  }
  audio { width: 100%; height: 40px; }
  fieldset {
    border: 1px solid #ccc;
    border-radius: 10px;
    margin: 12px 0 0;
    padding: 10px;
    background: #fafafa;
  }
  legend {
    font-weight: 700;
    font-size: 0.95rem;
    padding: 0 6px;
  }
  .opts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .opts label {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--tap);
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fff;
    font-size: 0.95rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opts label:active, .opts label:has(input:checked) {
    border-color: #0b5fff;
    background: #e8f0ff;
  }
  .opts input[type=radio] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .notes {
    width: 100%;
    min-height: 44px;
    font-size: 16px; /* prevent iOS zoom */
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 10px;
    margin-top: 8px;
  }
  .sticky {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #111;
    color: #fff;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    z-index: 50;
    box-shadow: 0 -4px 16px rgba(0,0,0,.2);
  }
  .sticky button {
    flex: 1;
    min-height: 48px;
    font-size: 1rem;
    font-weight: 700;
    border: 0;
    border-radius: 10px;
    background: #0b5fff;
    color: #fff;
  }
  .sticky .count { align-self: center; font-size: 0.85rem; opacity: .9; white-space: nowrap; }
  #status { margin-top: 10px; font-size: 0.9rem; color: #333; }
  #out { white-space: pre-wrap; font-size: 0.7rem; max-height: 120px; overflow: auto; background: #eee; padding: 8px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div class="banner">
  <h1>Stage A — Đánh giá phát âm (ẩn điểm)</h1>
  <p>Nghe FULL/LISTEN trước. <b>Không</b> hiện điểm số / ASR / phone.</p>
  <p>Câu hỏi: trẻ nói có gần đúng từ tiếng Anh mục tiêu không?</p>
</div>
<div id="root">Đang tải…</div>
<div id="status"></div>
<pre id="out"></pre>
<div class="sticky">
  <span class="count" id="prog">0/0</span>
  <button type="button" id="exp">Xuất CSV đánh giá</button>
</div>
<script>
const P = ["CLEAR_CORRECT","PROBABLY_CORRECT","AMBIGUOUS","PROBABLY_INCORRECT","CLEAR_INCORRECT"];
const B = ["BOUNDARY_OK","START_CUT","END_CUT","BOTH_CUT","BOUNDARY_UNCLEAR"];
const Q = ["CLEAR","NOISY","REVERBERANT","QUIET","DISTORTED","UNCERTAIN"];
const C = ["HIGH","MEDIUM","LOW"];
const PL = {
  CLEAR_CORRECT: "Rõ — đúng",
  PROBABLY_CORRECT: "Có lẽ đúng",
  AMBIGUOUS: "Không chắc",
  PROBABLY_INCORRECT: "Có lẽ sai",
  CLEAR_INCORRECT: "Rõ — sai",
  BOUNDARY_OK: "Cắt OK",
  START_CUT: "Cụt đầu",
  END_CUT: "Cụt đuôi",
  BOTH_CUT: "Cụt 2 đầu",
  BOUNDARY_UNCLEAR: "Boundary không rõ",
  CLEAR: "Rõ",
  NOISY: "Ồn",
  REVERBERANT: "Vang",
  QUIET: "Nhỏ",
  DISTORTED: "Mé o",
  UNCERTAIN: "Không rõ",
  HIGH: "Chắc cao",
  MEDIUM: "Chắc vừa",
  LOW: "Chắc thấp",
};

function radios(name, values) {
  return `<div class="opts">` + values.map(v =>
    `<label><input type="radio" name="${name}" value="${v}"><span>${PL[v]||v}</span></label>`
  ).join("") + `</div>`;
}

function card(it) {
  const rid = it.review_id;
  const clips = it.clips || {};
  return `<section class="card" id="${rid}">
    <h2>${rid}</h2>
    <div class="target">${(it.target||"").toUpperCase()}</div>
    <div class="meta">${it.speaker_id || ""} · ${it.age_metadata || ""}</div>
    <div class="audio-block"><div class="lbl">LISTEN</div><audio controls preload="none" src="${clips.LISTEN||""}"></audio></div>
    <div class="audio-block"><div class="lbl">FULL</div><audio controls preload="none" src="${clips.FULL||""}"></audio></div>
    <div class="audio-block"><div class="lbl">RAW crop</div><audio controls preload="none" src="${clips.RAW||""}"></audio></div>
    <div class="audio-block"><div class="lbl">PAD250</div><audio controls preload="none" src="${clips.PAD250||""}"></audio></div>
    <div class="audio-block"><div class="lbl">HYB pad</div><audio controls preload="none" src="${clips.HYB||""}"></audio></div>
    <fieldset><legend>1. Phát âm</legend>${radios("p_"+rid, P)}</fieldset>
    <fieldset><legend>2. Boundary</legend>${radios("b_"+rid, B)}</fieldset>
    <fieldset><legend>3. Chất lượng audio</legend>${radios("q_"+rid, Q)}</fieldset>
    <fieldset><legend>4. Độ chắc khi chấm</legend>${radios("c_"+rid, C)}</fieldset>
    <label style="display:block;margin-top:10px;font-weight:700">Ghi chú</label>
    <input class="notes" name="n_${rid}" placeholder="tuỳ chọn">
  </section>`;
}

function val(prefix, id) {
  const el = document.querySelector(`input[name="${prefix}_${id}"]:checked`);
  return el ? el.value : "";
}

function updateProg(ids) {
  let n = 0;
  for (const id of ids) if (val("p", id)) n++;
  document.getElementById("prog").textContent = n + "/" + ids.length;
}

fetch("review_metadata.json")
  .then(r => r.json())
  .then(meta => {
    const items = meta.items || [];
    const ids = items.map(x => x.review_id);
    document.getElementById("root").innerHTML = items.map(card).join("");
    document.body.addEventListener("change", () => updateProg(ids));
    updateProg(ids);

    document.getElementById("exp").onclick = () => {
      const lines = ["review_id,human_pronunciation,boundary_label,audio_quality,review_confidence,notes"];
      let missing = 0;
      for (const id of ids) {
        const p = val("p", id);
        if (!p) missing++;
        const notes = (document.querySelector(`input[name="n_${id}"]`) || {value:""}).value.replace(/,/g, ";");
        lines.push([id, p, val("b", id), val("q", id), val("c", id), notes].join(","));
      }
      const text = lines.join("\n");
      const out = document.getElementById("out");
      out.style.display = "block";
      out.textContent = text;
      document.getElementById("status").textContent =
        missing ? `Còn ${missing} item chưa chọn Phát âm — CSV vẫn tải được.` : "Đủ phát âm. Đang tải CSV…";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"}));
      a.download = "Human_Review_StageA_Filled.csv";
      a.click();
    };
  })
  .catch(e => {
    document.getElementById("root").textContent = "Lỗi tải review_metadata.json: " + e;
  });
</script>
</body>
</html>
