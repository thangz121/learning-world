name: content-schema
on: [pull_request]
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Validate vocab/quest/dialogue (real)
        run: python tools/validate_content.py Content/vocab Content/quests Content/dialogues
